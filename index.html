<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="burger.css" />
    <title>Burger Builder</title>
  </head>

  <body>
    <nav class="up_nav">
      <div class="main_div">
        <img src="./Capture.PNG" alt="Burger Builder Logo" />
      </div>

      <ul class="ul1">
        <li class="li_hover">
          <a href="./index.html">Burger Builder</a>
        </li>

        <li class="li_hover">
          <a href="./burger login file.html" target="_blank">Login</a>
        </li>
      </ul>
    </nav>

    <main class="upper_div">
      <div class="burger">
        <div class="upper_bun">
          <span class="seed1"></span>
          <span class="seed2"></span>
          <span class="seed3"></span>
          <span class="seed4"></span>
          <span class="seed5"></span>
          <span class="seed6"></span>
        </div>

        <p id="message" class="pre_1">
          <strong>No Ingredients Added</strong>
        </p>

        <div id="lettuce"></div>
        <div id="bacon"></div>
        <div id="Cheese"></div>
        <div id="Meat"></div>

        <div class="lower_bun"></div>
      </div>
    </main>

    <section class="controls_section">
      <div class="price_box">
        <span>Current Price:</span>
        <strong>$<span id="price">50.00</span></strong>
      </div>

      <div class="ingredients_controls">
        <div class="control_row">
          <span class="ingredient_name">Lettuce</span>

          <button
            class="btn_less"
            id="less_id"
            onclick="less_lettuce()"
          >
            Less
          </button>

          <button
            class="btn_more"
            onclick="add_lettuce()"
          >
            More
          </button>
        </div>

        <div class="control_row">
          <span class="ingredient_name">Bacon</span>

          <button
            class="btn_less"
            id="btn_less_bacon"
            onclick="less_bacon()"
          >
            Less
          </button>

          <button
            class="btn_more"
            onclick="add_bacon()"
          >
            More
          </button>
        </div>

        <div class="control_row">
          <span class="ingredient_name">Cheese</span>

          <button
            class="btn_less"
            id="btn_less_cheese"
            onclick="less_cheese()"
          >
            Less
          </button>

          <button
            class="btn_more"
            onclick="add_cheese()"
          >
            More
          </button>
        </div>

        <div class="control_row">
          <span class="ingredient_name">Meat</span>

          <button
            class="btn_less"
            id="btn_less_meat"
            onclick="less_meat()"
          >
            Less
          </button>

          <button
            class="btn_more"
            onclick="add_meat()"
          >
            More
          </button>
        </div>
      </div>

      <div class="order_box">
        <button
          class="btn_signin"
          onclick="saveOrder()"
        >
          <a href="./burger login file.html">
            SIGN UP TO ORDER
          </a>
        </button>
      </div>
    </section>

    <script src="./burger.js"></script>
  </body>
</html>
